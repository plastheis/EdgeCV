name: nanotrack
task: sot_template_matching
# NanoTrack V3 (HonglinChu/SiamTrackers). Split backbone+head architecture:
# backbone model (255x255 -> 96ch 16x16), head model (z_f 8x8 + x_f 16x16 ->
# cls, loc). mobilenetv3_small_v3 + depthwise cross-correlation.
# Trained on raw [0,255] crops (no /255, no mean/std); to_input preserves
# channel order. Exemplar feature centre-cropped 16->8 before head.
# exemplar/search are CONCEPTUAL crop-ratio sizes; model_input is the
# actual backbone input size (both crops resized to this).
preprocessing:
  color: rgb
  scale: 1.0
  exemplar: 127
  search: 255
  model_input: 255
  context: 0.5
  stride: 16
  base_size: 7
  penalty_k: 0.138
  window_influence: 0.455
  size_lr: 0.348
io:
  inputs:
    - { name: exemplar, shape: [1, 3, 127, 127], dtype: float32 }
    - { name: search,   shape: [1, 3, 255, 255], dtype: float32 }
  outputs:
    - { name: cls, shape: [1, 2, 15, 15], dtype: float32 }
    - { name: loc, shape: [1, 4, 15, 15], dtype: float32 }
artifacts:
  backbone: { path: nanotrack_backbone.onnx }
  head: { path: nanotrack_head.onnx }
  onnx: { path: nanotrack.onnx }
  rknn: { path: nanotrack.rk3588.rknn, quant: int8 }
