name: yolo_generic
task: detection
preprocessing:
  color: rgb
  input: 640
  scale: 0.00392156862745098
  output_format: yolov5
  class_agnostic: true
  conf_thresh: 0.25
  iou_thresh: 0.45
io:
  inputs:
    - { name: images, shape: [1, 3, 640, 640], dtype: float32 }
  outputs:
    - { name: output0, shape: [1, -1, 85], dtype: float32 }
artifacts:
  onnx: { path: yolo_generic.onnx }
  rknn: { path: yolo_generic.rk3588.rknn, quant: int8 }
