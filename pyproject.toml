[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgecv"
version = "0.0.1"
description = "Single-object visual trackers for real-time edge deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "plastheis" }]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional CF-ops accelerators. The numpy reference ops work without these;
# installing them just selects faster FFT/HOG/image paths (ARCHITECTURE.md §6.1, §12).
fast = ["scipy>=1.10", "numba>=0.58", "pyFFTW>=0.13", "opencv-python>=4.8"]
onnx = ["onnxruntime>=1.16"]
# rknn-toolkit-lite2 is NOT on PyPI; install it manually on-device.
# This extra exists only to signal intent — see README.
rknn = []
dev = []
# onnxruntime runs the onnx backend; onnx (builder) synthesizes throwaway models for the
# NN-tracker onnx integration test. Both are here so `pip install -e .[test]` exercises the
# real onnx path without separately pulling the [onnx] extra.
test = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8", "onnxruntime>=1.16", "onnx>=1.15"]

[project.entry-points."edgecv.backends"]
mock = "edgecv.backends.mock:MockBackend"
onnx = "edgecv.backends.onnx:OnnxBackend"
rknn = "edgecv.backends.rknn:RknnBackend"

[tool.hatch.build.targets.wheel]
packages = ["edgecv"]

[tool.hatch.build.targets.wheel.force-include]
"edgecv/models/profiles" = "edgecv/models/profiles"
"edgecv/models/manifests" = "edgecv/models/manifests"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
